name: minimercado
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: minimercado
      POSTGRES_DB: minimercado
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute npm run db:up}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minimercado -d minimercado"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
